<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title><link rel="stylesheet" href="chat.css?v=channel-roles-1"><link rel="stylesheet" href="../ui/feedback.css">
<script defer src="../ui/feedback.js"></script></head><body>
<section id="auth" aria-labelledby="authTitle"><div class="card">
<h1 id="authTitle">Welcome back</h1><p id="authIntro" role="status">Sign in to Goop Chat.</p>
<form id="authForm">
<label>Username<input id="username" autocomplete="username" minlength="3" maxlength="256" required></label>
<label id="emailField" hidden>Email <span>(optional)</span><input type="email" id="email" maxlength="254" autocomplete="email" disabled></label>
<label id="keyField" hidden>Recovery key<input id="recoveryInput" autocomplete="off" autocapitalize="none" disabled></label>
<label><span id="passwordLabel">Password</span><input type="password" id="password" maxlength="128" autocomplete="current-password"></label>
<button id="forgot" type="button" class="link">Forgot password?</button>
<button id="submitAuth" class="primary">Sign in</button>
</form><p id="authError" role="status"></p><p class="switch"><span id="switchLead">New to Goop?</span> <button class="link" id="authSwitch">Create an account</button></p>
</div></section>
<section id="recovery" hidden><div class="card"><h1>Save your recovery key</h1><p>Keep this key somewhere private. You can use it to reset your password.</p><output id="recoveryKey"></output><button id="continue" class="primary">Continue to Chat</button></div></section>
<main id="app" hidden>
<aside class="rooms"><a id="chatHome" href="../index.html" target="_top">Home</a><div class="identity"><span id="self"></span><button id="accountBtn">Account</button></div>
<div class="navGroup"><h2>Text channels</h2><nav id="textRooms" aria-label="Text channels"></nav></div>
<div class="navGroup"><h2>Voice channels</h2><nav id="voiceRooms" aria-label="Voice channels"></nav></div>
<div class="navGroup"><h2>Direct messages</h2><button id="newDM">New DM</button><nav id="inbox" aria-label="Direct messages"></nav></div>
<div id="adminTools" hidden><button id="createRoom">Create channel</button><button id="lockRoom" hidden>Lock channel</button><button id="manageRoles">Manage roles</button><button id="review">Review reports</button></div></aside>
<section class="thread">
<header><h1 id="room">Chat</h1><span id="connection" role="status"></span></header>
<section id="voicePanel" hidden><p id="voiceStatus" role="status"></p><div id="voicePeople"></div><div class="actions"><button id="joinVoice">Join voice</button><button id="mic" hidden>Mute mic</button><button id="leaveVoice" hidden>Leave voice</button><button id="playAudio" hidden>Enable audio</button></div><div id="audio"></div></section>
<div id="messages" role="log" aria-label="Messages"></div>
<div id="bottom"><p id="lockStatus" class="hint" role="status" hidden></p><form id="compose"><textarea id="text" rows="2" maxlength="1200" aria-label="Message" placeholder="Write a message" required></textarea><button class="primary" id="send">Send</button></form><p id="notice" role="status"></p></div>
</section></main>
<dialog id="tools"><form method="dialog" class="dialogHead"><h2 id="toolTitle"></h2><button aria-label="Close dialog">Close</button></form><div id="toolBody"></div><p id="toolStatus" role="status"></p></dialog>
<script src="../goop-config.js"></script><script type="module" src="./chat.js?v=channel-roles-home-1"></script>
</body></html>
